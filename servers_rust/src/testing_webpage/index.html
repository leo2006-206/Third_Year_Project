<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OBM Benchmark & Testing</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>OBM Benchmark & Testing</h1>

    <div class="layout">
        <div class="controls-panel">
            <label>Show: <select id="show-select"></select></label>
            <label>Strategy:
                <select id="offload-mode-select">
                    <option value="full" selected>Full Offload</option>
                    <option value="partial">Partial Offload</option>
                    <option value="non_offload">Non-Offload</option>
                </select>
            </label>
            <div id="partial-layers-group" style="display: none;">
                <label>Layers: <select id="partial-layers-select"></select></label>
            </div>
            <div id="layer-options-container"></div>
            <div class="url-preview-box">
                <strong>Request Target:</strong> <span id="url-preview">/offload/show/...</span>
            </div>
        </div>

        <div class="benchmark-panel">
            <div class="benchmark-header">
                <button id="benchmark-btn" class="btn">Start Benchmark</button>
                <button id="clear-btn" class="btn btn-secondary">Clear Results</button>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>Request URL</th>
                        <th>Sent Time</th>
                        <th>Receive Time (Duration)</th>
                        <th>Size</th>
                    </tr>
                </thead>
                <tbody id="log-body"></tbody>
            </table>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
